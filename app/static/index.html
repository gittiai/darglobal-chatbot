<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarGlobal Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400;500&family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--ink:#111;--mute:#6d675c;--accent:#7a6a45;--line:#e4dfd4;--sand:#f3efe7;--white:#fff}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--white);color:var(--ink);font:400 15px/1.65 Jost,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
main{flex:1;overflow-y:auto}
.hero{position:relative;min-height:360px;color:#fff;display:flex;flex-direction:column;
 background:linear-gradient(180deg,rgba(0,0,0,.55) 0%,rgba(0,0,0,.15) 45%,rgba(0,0,0,.45) 100%),url('/static/hero.jpg') center/cover,
 radial-gradient(ellipse at 70% 30%,#e8d3a8 0%,#b8935a 35%,#6b5233 70%,#2b2117 100%)}
.nav{display:flex;align-items:center;justify-content:space-between;padding:26px 6vw}
.left{display:flex;align-items:center;gap:28px}
.burger{width:32px;display:grid;gap:7px}.burger i{height:2px;background:#fff;display:block}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo b{font:600 46px/0.9 'Josefin Sans',Jost,sans-serif;letter-spacing:-.02em}
.logo span{font:300 10px Jost;letter-spacing:.85em;margin-top:6px;padding-left:.85em}
.navr{display:flex;align-items:center;gap:22px;font:500 14px Jost;letter-spacing:.12em;text-transform:uppercase}
.navr .lang{text-transform:none;letter-spacing:0;opacity:.9}
.hero-txt{margin:auto;text-align:center;padding:10px 20px 40px}
.hero-txt h1{font:400 clamp(34px,5vw,58px)/1 'Cormorant Garamond',serif;margin:0;letter-spacing:.01em;text-transform:uppercase}
.hero-txt em{display:block;font:italic 400 clamp(30px,4.4vw,52px)/1.1 'Cormorant Garamond',serif;text-transform:none}
.hero-txt small{display:block;margin-top:14px;font:500 11px Jost;letter-spacing:.3em;text-transform:uppercase;opacity:.9}
.intro{max-width:1100px;margin:0 auto;padding:56px 6vw 20px;display:grid;grid-template-columns:1.1fr 1fr;gap:48px;align-items:start}
.intro h2{font:400 clamp(30px,4vw,48px)/1.05 'Cormorant Garamond',serif;text-transform:uppercase;margin:0}
.intro h3{font:500 15px Jost;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);margin:4px 0 12px}
.intro p{margin:0;color:#333;font-size:16px}
#log{max-width:900px;margin:0 auto;padding:24px 6vw 30px}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0 30px}
.chips button{background:transparent;border:1px solid var(--ink);color:var(--ink);padding:10px 16px;font:500 12px Jost;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;transition:.2s}
.chips button:hover{background:var(--ink);color:#fff}
.m{margin:0 0 20px;max-width:88%}
.u{margin-left:auto;background:var(--ink);color:#fff;padding:12px 18px}
.a{background:var(--sand);padding:18px 22px;border-top:2px solid var(--accent)}
.a .who{font:500 11px Jost;letter-spacing:.25em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.a p{margin:.35em 0}.a ul,.a ol{padding-left:20px;margin:.4em 0}.a strong{font-weight:500}
.a h1,.a h2,.a h3{font:500 22px 'Cormorant Garamond',serif;margin:.6em 0 .3em}
.a table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;margin:.5em 0}.a th{background:#e9e3d6;font-weight:500}.a td,.a th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.src{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:12px;color:var(--mute)}
.src a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--accent);margin-right:10px;line-height:2}
.dots span{display:inline-block;width:5px;height:5px;margin-right:4px;background:var(--accent);border-radius:50%;animation:b 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
footer{background:#fff;border-top:1px solid var(--line)}
form{display:flex;max-width:900px;margin:0 auto;padding:14px 6vw 8px}
input{flex:1;border:1px solid var(--ink);border-right:0;padding:14px 16px;font:400 15px Jost;outline:none;min-width:0}
button.go{background:var(--ink);color:#fff;border:0;padding:0 28px;font:500 12px Jost;letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button.go:hover{background:var(--accent)}
.note{text-align:center;font-size:11px;color:var(--mute);padding:0 16px 10px}
@media(max-width:700px){.navr .hide{display:none}.logo b{font-size:36px}.intro{grid-template-columns:1fr;gap:16px;padding-top:36px}.hero{min-height:300px}.m{max-width:100%}}
</style></head><body>
<main id="main">
<section class="hero"><div class="nav"><div class="left"><div class="logo"><b>DAR</b><span>GLOBAL</span></div></div></div>
<div class="hero-txt"><h1>DarGlobal</h1><em>Concierge</em><small>Branded residences · Saudi Arabia · UAE · Qatar · Oman · Spain</small></div></section>
<div id="log"><div class="chips" id="chips"></div></div></main>
<footer><form id="f"><input id="q" placeholder="Ask about projects, locations, listings…" autocomplete="off"><button class="go">Send</button></form>
<div class="note">Candidate demo for the DarGlobal Applied AI assignment, not an official DarGlobal site · answers from public DarGlobal &amp; Wasalt data · AI may make mistakes</div></footer>
<script>
const log=document.getElementById('log'),main=document.getElementById('main'),q=document.getElementById('q'),hist=[];let busy=false;
["Trump-branded projects","Les Vagues by Elie Saab, Qatar","DarGlobal H1 2026 results","What is Wasalt?","Riyadh districts on Wasalt","DarGlobal projects in Spain"].forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>send(s);document.getElementById('chips').appendChild(b)});
const md=t=>DOMPurify.sanitize(marked.parse(t));const esc=s=>s.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function el(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.appendChild(d);main.scrollTop=main.scrollHeight;return d}
async function send(text){text=text.trim();if(!text||busy)return;busy=true;q.value='';
el('u',esc(text));hist.push({role:'user',content:text});
const d=el('a','<div class="who">DarGlobal Concierge</div><div class="body"><span class="dots"><span></span><span></span><span></span></span></div>');const body=d.querySelector('.body');
let ans='',sources=[],err=null;
try{const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist})});
if(!r.ok)throw new Error((await r.json()).detail||'Request failed');
const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(!line)continue;const o=JSON.parse(line);
if(o.sources)sources=o.sources;if(o.delta){ans+=o.delta;body.innerHTML=md(ans);main.scrollTop=main.scrollHeight}if(o.error)err=o.error}}
}catch(e){err=e.message}
if(!ans){body.textContent=err||'No answer, please retry.';hist.pop()}else{hist.push({role:'assistant',content:ans});
if(sources.length){const s=document.createElement('div');s.className='src';s.innerHTML='Sources &nbsp;'+sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${x.n}. ${esc(x.title.slice(0,48))}</a>`).join('');d.appendChild(s)}}
busy=false;main.scrollTop=main.scrollHeight;q.focus()}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(q.value)};
</script></body></html>
