<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarGlobal & Wasalt Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#1c1b19;--mute:#6b675f;--gold:#a8844b;--line:#e6e1d6}
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card)}header h1{margin:0;font-size:17px;letter-spacing:.02em}header p{margin:2px 0 0;color:var(--mute);font-size:13px}
#log{flex:1;overflow-y:auto;padding:20px;max-width:820px;width:100%;margin:0 auto}
.m{margin:0 0 14px;padding:12px 14px;border-radius:12px;max-width:88%;white-space:pre-wrap;word-wrap:break-word}
.u{background:var(--ink);color:#fff;margin-left:auto}.a{background:var(--card);border:1px solid var(--line);white-space:normal}.a p{margin:.3em 0}.a table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto}.a td,.a th{border:1px solid var(--line);padding:4px 6px}.a ul,.a ol{padding-left:20px;margin:.3em 0}
.src{font-size:12px;color:var(--mute);margin-top:8px;white-space:normal}.src a{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.chips button{border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;cursor:pointer;font-size:13px}
form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:var(--card);max-width:820px;width:100%;margin:0 auto}
input{flex:1;padding:12px;border:1px solid var(--line);border-radius:10px;font-size:15px}button.go{background:var(--gold);color:#fff;border:0;border-radius:10px;padding:0 18px;cursor:pointer}
</style></head><body>
<header><h1>DarGlobal &amp; Wasalt Assistant</h1><p>Answers from publicly available DarGlobal &amp; Wasalt data · free model via OpenRouter</p></header>
<div id="log"><div class="chips" id="chips"></div></div>
<form id="f"><input id="q" placeholder="Ask about DarGlobal projects or Wasalt listings…" autocomplete="off"><button class="go">Send</button></form>
<script>
const log=document.getElementById('log'),q=document.getElementById('q'),hist=[];
["Which Trump-branded projects does DarGlobal have?","What was DarGlobal's revenue in H1 2026?","What is Wasalt and what services does it offer?","How many apartments are listed on Wasalt?","Which districts in Riyadh does Wasalt cover?","Tell me about Les Vagues in Qatar"].forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>send(s);document.getElementById('chips').appendChild(b)});
function add(cls,text){const d=document.createElement('div');d.className='m '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(text){if(!text.trim())return;add('u',text);hist.push({role:'user',content:text});q.value='';const d=add('a','Thinking…');
try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist})});const j=await r.json();
if(!r.ok)throw new Error(j.detail||'Error');d.innerHTML=DOMPurify.sanitize(marked.parse(j.answer));hist.push({role:'assistant',content:j.answer});
if(j.sources?.length){const s=document.createElement('div');s.className='src';s.innerHTML='Sources: '+j.sources.map(x=>`<a href="${x.url}" target="_blank" rel="noopener">[${x.n}] ${x.title.replace(/</g,'&lt;').slice(0,60)}</a>`).join(' · ')+` <br>model: ${j.model}`;d.appendChild(s)}}
catch(e){d.textContent='⚠ '+e.message;hist.pop()}log.scrollTop=log.scrollHeight}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(q.value)};
</script></body></html>
