name: keep-awake
# Render's free plan sleeps after 15 min idle; ping the app so reviewers never hit a cold start.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 90 --retry 2 https://darglobal-chatbot-c3rn.onrender.com/health
