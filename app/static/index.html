<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarGlobal Concierge</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<style>
:root{--black:#0b0b0b;--ivory:#f7f4ee;--sand:#e9e2d4;--bronze:#a68a5b;--ink:#1a1a1a;--mute:#7a7468;--line:#ddd5c6;--card:#fff}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--ivory);color:var(--ink);font:300 15px/1.65 Montserrat,system-ui,sans-serif;display:flex;flex-direction:column;height:100dvh}
header{background:var(--black);color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.brand{font:500 22px/1 'Cormorant Garamond',serif;letter-spacing:.32em;text-transform:uppercase}
.brand small{display:block;font:400 10px/1.8 Montserrat,sans-serif;letter-spacing:.35em;color:var(--bronze);margin-top:6px}
.tag{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#bdb6a8;text-align:right}
.hero{text-align:center;padding:44px 20px 12px}
.hero h1{font:400 clamp(30px,5vw,46px)/1.15 'Cormorant Garamond',serif;margin:0 0 10px;letter-spacing:.02em}
.hero p{margin:0 auto;max-width:520px;color:var(--mute);font-size:13px;letter-spacing:.04em}
.rule{width:56px;height:1px;background:var(--bronze);margin:18px auto}
main{flex:1;overflow-y:auto}
#log{max-width:820px;margin:0 auto;padding:8px 20px 24px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:8px 0 28px}
.chips button{background:transparent;border:1px solid var(--line);color:var(--ink);padding:9px 16px;font:400 12px Montserrat,sans-serif;letter-spacing:.06em;cursor:pointer;transition:.2s}
.chips button:hover{border-color:var(--black);background:var(--black);color:#fff}
.m{margin:0 0 18px;max-width:88%}
.u{margin-left:auto;background:var(--black);color:#fff;padding:12px 18px;font-weight:400}
.a{background:var(--card);border:1px solid var(--line);border-left:2px solid var(--bronze);padding:16px 20px}
.a .who{font:500 10px Montserrat;letter-spacing:.3em;text-transform:uppercase;color:var(--bronze);margin-bottom:8px}
.a p{margin:.35em 0}.a ul,.a ol{padding-left:20px;margin:.4em 0}.a strong{font-weight:500}
.a h1,.a h2,.a h3{font:500 20px 'Cormorant Garamond',serif;margin:.6em 0 .3em}
.a table{border-collapse:collapse;font-size:13px;display:block;overflow-x:auto;margin:.5em 0}.a th{background:var(--sand);font-weight:500}.a td,.a th{border:1px solid var(--line);padding:6px 8px;text-align:left}
.src{border-top:1px solid var(--line);margin-top:12px;padding-top:10px;font-size:11px;color:var(--mute);letter-spacing:.03em}
.src a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--bronze);margin-right:10px;line-height:2}
.dots span{display:inline-block;width:5px;height:5px;margin-right:4px;background:var(--bronze);border-radius:50%;animation:b 1.2s infinite}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes b{0%,80%,100%{opacity:.2}40%{opacity:1}}
footer{background:var(--card);border-top:1px solid var(--line)}
form{display:flex;max-width:820px;margin:0 auto;padding:14px 20px;gap:0}
input{flex:1;border:1px solid var(--black);border-right:0;padding:14px 16px;font:300 15px Montserrat,sans-serif;background:#fff;outline:none;min-width:0}
button.go{background:var(--black);color:#fff;border:0;padding:0 26px;font:500 11px Montserrat;letter-spacing:.25em;text-transform:uppercase;cursor:pointer}
button.go:hover{background:var(--bronze)}
.note{text-align:center;font-size:10px;color:var(--mute);letter-spacing:.08em;padding:0 0 10px}
@media(max-width:600px){header{padding:14px 16px}.tag{display:none}.m{max-width:100%}#log{padding:8px 16px 20px}form{padding:12px 16px}}
</style></head><body>
<header><div class="brand">DarGlobal<small>Concierge</small></div><div class="tag">DarGlobal · Wasalt<br>Luxury Real Estate</div></header>
<main id="main"><div class="hero"><h1>How may we assist you?</h1><div class="rule"></div><p>Ask about DarGlobal's branded developments worldwide or Saudi properties on Wasalt.</p></div>
<div id="log"><div class="chips" id="chips"></div></div></main>
<footer><form id="f"><input id="q" placeholder="Ask about projects, locations, listings…" autocomplete="off"><button class="go">Send</button></form>
<div class="note">Answers drawn from publicly available DarGlobal &amp; Wasalt information · AI may make mistakes</div></footer>
<script>
const log=document.getElementById('log'),main=document.getElementById('main'),q=document.getElementById('q'),hist=[];let busy=false;
["Trump-branded projects","Les Vagues by Elie Saab, Qatar","DarGlobal H1 2026 results","What is Wasalt?","Riyadh districts on Wasalt","DarGlobal projects in Spain"].forEach(s=>{const b=document.createElement('button');b.type='button';b.textContent=s;b.onclick=()=>send(s);document.getElementById('chips').appendChild(b)});
const md=t=>DOMPurify.sanitize(marked.parse(t));const esc=s=>s.replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
function el(cls,html){const d=document.createElement('div');d.className='m '+cls;d.innerHTML=html;log.appendChild(d);main.scrollTop=main.scrollHeight;return d}
async function send(text){text=text.trim();if(!text||busy)return;busy=true;q.value='';
el('u',esc(text));hist.push({role:'user',content:text});
const d=el('a','<div class="who">DarGlobal Concierge</div><div class="body"><span class="dots"><span></span><span></span><span></span></span></div>');const body=d.querySelector('.body');
let ans='',sources=[],err=null;
try{const r=await fetch('/api/chat/stream',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:hist})});
if(!r.ok)throw new Error((await r.json()).detail||'Request failed');
const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
for(;;){const {done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;
while((i=buf.indexOf('\n'))>=0){const line=buf.slice(0,i);buf=buf.slice(i+1);if(!line)continue;const o=JSON.parse(line);
if(o.sources)sources=o.sources;if(o.delta){ans+=o.delta;body.innerHTML=md(ans);main.scrollTop=main.scrollHeight}if(o.error)err=o.error}}
}catch(e){err=e.message}
if(!ans){body.textContent=err||'No answer, please retry.';hist.pop()}else{hist.push({role:'assistant',content:ans});
if(sources.length){const s=document.createElement('div');s.className='src';s.innerHTML='Sources &nbsp;'+sources.map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener">${x.n}. ${esc(x.title.slice(0,48))}</a>`).join('');d.appendChild(s)}}
busy=false;main.scrollTop=main.scrollHeight;q.focus()}
document.getElementById('f').onsubmit=e=>{e.preventDefault();send(q.value)};
</script></body></html>
